# Marc Lavoie, 2026-10-04: Keep the public Pages URL without republishing installer binaries or download links.
name: Publish LusoVela availability notice
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-installer.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: lusovela-installer-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create download-free Pages content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          printf '%s\n' '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>LusoVela downloads</title><p>Downloads are temporarily unavailable.</p></html>' > site/index.html
          touch site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy download-free Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
