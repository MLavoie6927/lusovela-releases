name: Publish LusoVela installer for Microsoft Store
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-installer.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: lusovela-installer-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify release for current Store draft
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the user's existing draft URL. Freeze these bytes after submission.
          mkdir -p site/v1.4.17
          curl --fail --location --retry 3 --silent --show-error --output site/v1.4.17/LusoVela-Setup-1.4.17.exe https://github.com/MLavoie6927/lusovela-releases/releases/download/v1.4.18/LusoVela-Setup-1.4.18.exe
          echo '85c31269ff751a02b923884cf393640017223405d296e7bae68dd215cd260c74  site/v1.4.17/LusoVela-Setup-1.4.17.exe' | sha256sum --check
          echo '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex"><title>LusoVela installer</title><p><a href="v1.4.17/LusoVela-Setup-1.4.17.exe">Download LusoVela 1.4.18 for Windows x64</a></p></html>' > site/index.html
          touch site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
