name: Publish LusoVela installer for Microsoft Store

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-installer.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lusovela-installer-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify the versioned release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/v1.4.17
          curl --fail --location --retry 3 --silent --show-error \
            --output site/v1.4.17/LusoVela-Setup-1.4.17.exe \
            https://github.com/MLavoie6927/lusovela-releases/releases/download/v1.4.17/LusoVela-Setup-1.4.17.exe
          printf '%s  %s\n' \
            'ead4eabf56705caafbb153fef2a672335264da2b1803ce00db5aa1e11fb0a252' \
            'site/v1.4.17/LusoVela-Setup-1.4.17.exe' | sha256sum --check
          printf '%s\n' \
            '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex"><title>LusoVela installer</title><p><a href="v1.4.17/LusoVela-Setup-1.4.17.exe">Download LusoVela 1.4.17 for Windows x64</a></p></html>' \
            > site/index.html
          touch site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
